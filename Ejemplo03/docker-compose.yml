services:
  # Servicio 1: Servidor Web NGINX
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Servicio 2: Procesador PHP (Construido desde nuestro Dockerfile)
  php:
    build: .
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db

  # Servicio 3: Base de Datos MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_base_datos
      MYSQL_USER: usuario_app
      MYSQL_PASSWORD: password_app
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: